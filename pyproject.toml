[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athar"
version = "0.2.1"
description = "Verifiable erasure receipts – reference implementation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Khafi Labs (My Personal Laboratories)" }
]
keywords = [
    "erasure",
    "privacy",
    "gdpr",
    "cryptography",
    "audit",
    "receipts",
    "merkle-tree",
    "ed25519"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "pynacl>=1.5.0",
    "cryptography>=50.0.2",
    "canonicaljson>=2.0.0",
]

[project.optional-dependencies]
verifier = [
    "pynacl>=1.5.0",
    "cryptography>=50.0.2",
    "canonicaljson>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[project.scripts]
athar = "athar.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["athar*", "verifier*", "demo*"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
# Style-only rules deferred: long lines in docstrings, str-enum style, simplify suggestions.
ignore = ["E501", "UP042", "SIM102", "SIM105", "SIM108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "canonicaljson.*",
    "nacl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
pythonpath = ["src", "."]
