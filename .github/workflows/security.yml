# Dependency vulnerability audit. Runs weekly and whenever dependencies change,
# because new advisories appear without any code change.
name: Security audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  pull_request:
    paths: ["pyproject.toml"]

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install .
      - name: Audit installed dependencies
        run: pip-audit --skip-editable
