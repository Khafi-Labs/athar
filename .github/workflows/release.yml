# Builds the sdist and wheel for every v* tag and publishes a GitHub
# pre-release with an SPDX SBOM, checksums and a signed build-provenance
# attestation. Run it by hand (workflow_dispatch) to rehearse without publishing.
# It does not upload to PyPI.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: SBOM and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq '.sbom' > dist/athar.spdx.json
          test -s dist/athar.spdx.json
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          Alpha research prototype. Not a compliance product, not legal advice, not
          independently audited; key destruction is simulated. See docs/limits_of_the_claim.md.

          Verify a download: `gh attestation verify <file> --repo Khafi-Labs/athar`
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Athar $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --prerelease
